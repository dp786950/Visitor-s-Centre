<div class="col-md-4"><label>Person contacted</label><input name="person_contacted" class="form-control"></div><div class="col-md-4"><label>Persons in group</label><input name="group_size" id="gs" type="number" min="1" max="50" value="1" class="form-control" onchange="mem()"></div></div><div id="mems" class="mt-2"></div>
<div class="sec">D. Reception Entrance / Post</div><div class="row g-2"><div class="col-md-4"><label>Reception post *</label><select name="post_id" class="form-select" required><option value="">Select…</option>${POSTS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="col-md-4"><label>Registration</label><select name="mode" id="mode" class="form-select" onchange="$('#exw').hidden=this.value!='expected'"><option value="checkin">Check in now (arrival time = now)</option><option value="expected">Expected visitor (appointment)</option></select></div><div class="col-md-4" id="exw" hidden><label>Expected arrival</label><input type="datetime-local" name="expected_at" class="form-control"></div></div><small class="text-muted">Officer on duty: ${esc(ME.full_name)}. Departure is recorded later via Manage Visitors → Check out.</small>
<div class="mt-3 d-flex flex-wrap gap-2"><button class="btn btn-primary">Save Visitor</button><button type="button" class="btn btn-gold" style="background:var(--gold)" onclick="saveVisit(event,true)"><i class="fa-solid fa-print"></i> Save &amp; Print Pass</button><button type="reset" class="btn btn-outline-secondary" onclick="setTimeout(mem,0)">Clear Form</button></div></form>`;
function fillHost(){const x=DIR.find(d=>(d.mp_name||d.office_name)==$('#host').value);if(x){$('#hd').value=x.designation||'';$('#ho').value=x.office_name||x.department||'';$('#hr').value=x.location||''}}
function mem(){const n=Math.max(1,Math.min(50,+$('#gs').value||1));$('#mems').innerHTML=n>1?'<b>Other group members</b>'+Array.from({length:n-1},(_,i)=>`<div class="row g-2 mt-1"><div class="col-md-8"><input name="m_name${i+1}" class="form-control" placeholder="Member ${i+2} full name" required></div><div class="col-md-4">${sel('m_g'+(i+1),['Male','Female','Other','Prefer not to say'])}</div></div>`).join(''):''}
async function saveVisit(e,print){e.preventDefault();const form=$('#rf');if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form)),n=Math.max(1,+f.group_size||1);
 if(f.mode=='expected'&&!f.expected_at)return toast('Enter the expected arrival time',1);
 const people=[{full_name:f.full_name,gender:f.gender,nationality:f.nationality,phone:f.phone,email:f.email,organisation:f.organisation,id_type:f.id_type,id_masked:f.id_ref?'****'+f.id_ref.slice(-4):'',verification_status:f.verification_status,issuing_country:f.issuing_country}];
 for(let i=1;i<n;i++)people.push({full_name:f['m_name'+i],gender:f['m_g'+i],nationality:f.nationality,organisation:f.organisation});
 const res=await rpc('register_visit',{p:{people,mode:f.mode,expected_at:f.mode=='expected'?f.expected_at+':00Z':'',post_id:f.post_id,host_name:f.host_name,host_designation:f.host_designation,office:f.office,destination_room:f.destination_room,purpose:f.purpose,appointment_type:f.appointment_type,person_contacted:f.person_contacted}});
 LAST=await q(sb.from('visit_log').select('*').in('visitor_reference',res.map(r=>r.ref)).order('visitor_reference'));const ids=LAST.map(r=>r.id);
 $('#rres').innerHTML=`<div class="panel border-success"><h5 class="text-success"><i class="fa-solid fa-circle-check"></i> Registered</h5><p>${LAST.map(r=>`<b>${r.visitor_reference}</b> – ${esc(r.full_name)}`).join('<br>')}${res[0].gref?`<br>Group reference: <b>${res[0].gref}</b>`:''}</p><div class="d-flex flex-wrap gap-2"><button class="btn btn-primary" onclick="openPass([${ids}]);setTimeout(printPass,500)">SAVE &amp; PRINT VISITOR PASS</button><button class="btn btn-outline-primary" onclick="openPass([${ids}])">VIEW VISITOR PASS</button><button class="btn btn-outline-secondary" onclick="show('reg')">REGISTER ANOTHER VISITOR</button></div></div>`;
 form.reset();mem();scrollTo(0,0);if(print){openPass(ids);setTimeout(printPass,500)}}
/* ---------- pass ---------- */
const passHtml=(r,sz)=>`<div class="pass ${sz}"><div class="ph"><b>PARLIAMENT OF GHANA</b><span>VISITORS CENTRE DEPARTMENT</span><em>VISITOR REGISTRATION PASS</em></div><div class="ref">${r.visitor_reference}</div><div class="qr" data-q="${r.visitor_reference}"></div><table>${[['Visitor',r.full_name],['Purpose',r.purpose],['Visiting',[r.host_name,r.office].filter(Boolean).join(' – ')],['Room / destination',r.destination_room],['Group',r.group_reference?`${r.group_size} persons (${r.group_reference})`:'Individual (1)'],['Entrance / post',r.entry_post],['Date',fD(r.visit_date)],['Arrival',fT(r.entry_at||r.expected_at)],['Officer on duty',r.registered_by_name],['Status',lbl(r.status)]].map(([k,v])=>`<tr><th>${k}</th><td>${esc(v)||'—'}</td></tr>`).join('')}</table><div class="sig">Authorised officer signature / stamp</div><p class="nt">This pass is a visitor registration record and does not independently authorise access to restricted areas. Access remains subject to security verification and approval.</p><div class="ft">PARLIAMENT OF GHANA – VISITORS CENTRE DEPARTMENT<br>Please retain this pass for verification during your visit.</div>${r.pass_print_count>0?'<span class="rp">REPRINT</span>':''}</div>`;
const qrs=el=>el.querySelectorAll('[data-q]').forEach(d=>{d.innerHTML='';try{new QRCode(d,{text:d.dataset.q,width:64,height:64})}catch{}});
function openPass(ids){PR=ids.map(i=>LAST.find(r=>r.id==i)).filter(Boolean);const sz=localStorage.pgh_pass||'A6';bx('Visitor pass preview',`<div class="noprint mb-2 d-flex gap-2 flex-wrap"><select id="psz" class="form-select w-auto" onchange="prevPass()">${[['A5','A5'],['A6','A6'],['rc','Receipt (80mm)']].map(([v,t])=>`<option value="${v}" ${v==sz?'selected':''}>${t}</option>`).join('')}</select><button class="btn btn-primary" onclick="printPass()"><i class="fa-solid fa-print"></i> Print ${PR.length>1?PR.length+' passes':'pass'}</button></div><div id="prev" class="prev"></div>`);prevPass()}
function prevPass(){const sz=$('#psz').value;$('#prev').innerHTML=PR.map(r=>passHtml(r,sz)).join('');qrs($('#prev'))}
async function printPass(){const sz=$('#psz').value;localStorage.pgh_pass=sz;$('#printArea').innerHTML=PR.map(r=>passHtml(r,sz)).join('');qrs($('#printArea'));
 const st=$('#pgst')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'pgst'}));st.textContent=`@page{size:${sz=='rc'?'80mm auto':sz+' portrait'};margin:4mm}`;
 for(const r of PR)await sb.rpc('visit_action',{vid:r.id,act:'print',post:null});
 document.body.classList.add('pp');setTimeout(()=>{print();document.body.classList.remove('pp');if(view!='reg')refresh()},350)}
/* ---------- manage / tracking ---------- */
V.mng=()=>`<h4>Manage Visitors</h4><div class="panel"><div class="row g-2 mb-2"><div class="col-md-4"><input id="ms" class="form-control" placeholder="Reference (e.g. PG-VC-2026-00001), name, office…" onkeydown="if(event.key=='Enter')mngLoad()"></div><div class="col-md-2"><select id="mst" class="form-select" onchange="mngLoad()"><option value="">All statuses</option><option>Expected</option><option>Checked In</option><option>Checked Out</option><option>Cancelled</option></select></div><div class="col-md-2"><input type="date" id="mf" class="form-control" onchange="mngLoad()"></div><div class="col-md-2"><input type="date" id="mt2" class="form-control" onchange="mngLoad()"></div><div class="col-md-2"><button class="btn btn-primary w-100" onclick="mngLoad()">Search</button></div></div><div id="ml"></div></div>`;
after.mng=()=>mngLoad();
async function mngLoad(){let b=sb.from('visit_log').select('*').order('created_at',{ascending:false}).limit(300);const s=($('#ms').value||'').replace(/[,()%]/g,' ').trim();
 if(s)b=b.or(`visitor_reference.ilike.%${s}%,group_reference.ilike.%${s}%,full_name.ilike.%${s}%,office.ilike.%${s}%,host_name.ilike.%${s}%`);if($('#mst').value)b=b.eq('status',$('#mst').value);if($('#mf').value)b=b.gte('visit_date',$('#mf').value);if($('#mt2').value)b=b.lte('visit_date',$('#mt2').value);
 const r=await q(b);$('#ml').innerHTML=grid(r,true)}
function det(id){const r=LAST.find(x=>x.id==id);if(!r)return;bx(r.visitor_reference,`<table class="table table-sm">${[['Visitor',r.full_name],['Gender',r.gender],['Organisation',r.organisation],['Mobile',r.phone],['ID type / verification',[r.id_type,r.verification_status].filter(Boolean).join(' / ')],['Visiting',[r.host_name,r.host_designation,r.office].filter(Boolean).join(', ')],['Room',r.destination_room],['Purpose',r.purpose],['Group',r.group_reference?`${r.group_reference} – ${r.group_size} persons (leader: ${r.group_leader})`:'Individual'],['Registered',fDT(r.created_at)],['Registered by',r.registered_by_name],['Entrance',r.entry_post],['Arrival / expected',fDT(r.entry_at||r.expected_at)],['Departure',fDT(r.exit_at)],['Exit post',r.exit_post],['Pass prints',r.pass_print_count]].map(([k,v])=>`<tr><th>${k}</th><td>${esc(v)||'—'}</td></tr>`).join('')}<tr><th>Status</th><td>${badge(r.status)}</td></tr></table><div class="d-flex flex-wrap gap-2"><button class="btn btn-primary" onclick="openPass([${r.id}])">${r.pass_print_count?'Reprint':'View'} pass</button>${r.group_reference?`<button class="btn btn-outline-primary" onclick="grpPass('${r.group_reference}')">Group passes</button>`:''}${r.status=='Expected'?`<button class="btn btn-success" onclick="act(${r.id},'checkin')">Check in</button>`:''}${r.status=='Checked In'?`<button class="btn btn-warning" onclick="act(${r.id},'checkout')">Check out</button>`:''}${ADMIN&&['Expected','Checked In'].includes(r.status)?`<button class="btn btn-outline-danger" onclick="act(${r.id},'cancel')">Cancel record</button>`:''}</div>`)}
async function grpPass(g){LAST=await q(sb.from('visit_log').select('*').eq('group_reference',g).order('visitor_reference'));openPass(LAST.map(r=>r.id))}
function postPick(t,cb){window._cb=cb;bx(t,`<select id="pp" class="form-select mb-2">${POSTS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn btn-primary" onclick="_cb(+$('#pp').value)">Confirm</button>`)}
function act(id,a){const go=async post=>{await rpc('visit_action',{vid:id,act:a,post});modal.hide();toast(a=='cancel'?'Record cancelled':a=='checkin'?'Checked in':'Checked out');refresh()};if(a=='cancel'){if(confirm('Cancel this visitor record? This is logged in the audit trail.'))go(null);return}postPick(a=='checkin'?'Reception post for check-in':'Exit post',go)}
/* ---------- logbooks ---------- */
const stBar=s=>`<div class="row g-2 mb-3">${[['Total visitors',s.total],['Currently inside',s.inside],['Checked out',s.out],['Offices visited',s.offices]].map(([k,v])=>`<div class="col-6 col-lg-3"><div class="kc"><small>${k}</small><b>${v}</b></div></div>`).join('')}</div>`;
V.day=()=>{DAY=DAY||T();TITLE='Daily-'+DAY;return`<h4>Daily Logbook</h4><div class="panel"><div class="row g-2 mb-2 noprint"><div class="col-md-3"><input type="date" id="dd" class="form-control" value="${DAY}" onchange="DAY=this.value;dayLoad()"></div><div class="col-md"><input id="dq" class="form-control" placeholder="Search name / reference / office" oninput="dayLoad()"></div><div class="col-md-3"><select id="ds" class="form-select" onchange="dayLoad()"><option value="">All statuses</option><option>Expected</option><option>Checked In</option><option>Checked Out</option><option>Cancelled</option></select></div><div class="col-auto">${exp()}</div></div><div id="dh"></div><div id="dl"></div></div>`};
after.day=()=>dayLoad();
async function dayLoad(){const d=$('#dd').value;TITLE='Daily-'+d;let b=sb.from('visit_log').select('*').eq('visit_date',d).order('created_at');const s=($('#dq').value||'').replace(/[,()%]/g,' ').trim();if(s)b=b.or(`visitor_reference.ilike.%${s}%,full_name.ilike.%${s}%,office.ilike.%${s}%,host_name.ilike.%${s}%`);if($('#ds').value)b=b.eq('status',$('#ds').value);
 LOGROWS=await q(b.limit(1000));GETROWS=async()=>LOGROWS;$('#dh').innerHTML=repHead('Daily Visitor Register',fD(d))+`<p>Visitors registered: <b>${LOGROWS.filter(r=>r.status!='Cancelled').length}</b></p>`;$('#dl').innerHTML=grid(LOGROWS,true)}
const mfirst=ym=>[ym+'-01',new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5,7),1)).toISOString().slice(0,10)];
let MON='',ANN='';
V.mon=()=>{MON=MON||T().slice(0,7);return`<h4>Monthly Logbook</h4><div class="panel"><div class="d-flex flex-wrap gap-2 mb-2 noprint"><input type="month" id="mm" class="form-control w-auto" value="${MON}" onchange="MON=this.value;show('mon')">${exp()}</div>${repHead('Monthly Visitor Report',MON)}<div id="mb2"></div></div>`};
after.mon=async()=>{const [a,b]=mfirst(MON),last=new Date(+MON.slice(0,4),+MON.slice(5,7),0).getDate(),s=await rpc('period_stats',{a,b:MON+'-'+last});TITLE='Monthly-'+MON;GETROWS=()=>all(()=>sb.from('visit_log').select('*').gte('visit_date',a).lt('visit_date',b).order('visit_date'));
 $('#mb2').innerHTML=stBar(s)+`<div class="row g-3"><div class="col-lg-6"><h6>Daily totals</h6><canvas id="x1"></canvas></div><div class="col-lg-6"><h6>Gender</h6><canvas id="x2" style="max-height:260px"></canvas></div><div class="col-lg-6"><h6>By MP / office</h6><canvas id="x3"></canvas></div><div class="col-lg-6"><h6>By entrance</h6><canvas id="x4"></canvas></div></div><h6 class="mt-3">Daily breakdown</h6>${kv(s.by_day.map(x=>({k:fD(x.k),n:x.n})),'Date')}`;
 chart('x1','bar',s.by_day.map(x=>({k:x.k.slice(8),n:x.n})),'Visitors');chart('x2','doughnut',s.gender,'');chart('x3','bar',s.office,'Visitors');chart('x4','bar',s.entrance,'Visitors')};
V.ann=()=>{ANN=ANN||T().slice(0,4);return`<h4>Annual Logbook</h4><div class="panel"><div class="d-flex flex-wrap gap-2 mb-2 noprint"><input type="number" id="yy" class="form-control w-auto" min="2000" max="2100" value="${ANN}" onchange="ANN=this.value;show('ann')">${exp()}</div>${repHead('Annual Visitor Report',ANN)}<div id="ab"></div></div>`};
after.ann=async()=>{const s=await rpc('period_stats',{a:ANN+'-01-01',b:ANN+'-12-31'});TITLE='Annual-'+ANN;GETROWS=()=>all(()=>sb.from('visit_log').select('*').gte('visit_date',ANN+'-01-01').lt('visit_date',(+ANN+1)+'-01-01').order('visit_date'));
 $('#ab').innerHTML=stBar(s)+`<div class="row g-3"><div class="col-lg-6"><h6>Monthly breakdown</h6><canvas id="x1"></canvas></div><div class="col-lg-6"><h6>Annual trend (all years)</h6><canvas id="x2"></canvas></div><div class="col-lg-6"><h6>By MP / office</h6><canvas id="x3"></canvas></div><div class="col-lg-6"><h6>By entrance</h6><canvas id="x4"></canvas></div></div><h6 class="mt-3">Monthly summary</h6>${kv(s.by_month.map(x=>({k:MN[x.k-1],n:x.n})),'Month')}`;
 chart('x1','bar',s.by_month,'Visitors',MN);chart('x2','bar',s.by_year,'Visitors');chart('x3','bar',s.office,'Visitors');chart('x4','bar',s.entrance,'Visitors')};
/* ---------- calendar ---------- */
V.cal=()=>`<h4>Visitor Calendar</h4><div class="d-flex flex-wrap gap-2 small mb-2"><span class="bd" style="background:#0d6efd">Expected</span><span class="bd" style="background:#198754">Checked In</span><span class="bd" style="background:#6c757d">Completed</span><span class="bd" style="background:#dc3545">Cancelled</span></div><div class="panel"><div id="cal"></div></div>`;
after.cal=()=>{const sm=innerWidth<700;cal=new FullCalendar.Calendar($('#cal'),{timeZone:'UTC',initialView:sm?'listWeek':'dayGridMonth',headerToolbar:sm?{left:'prev,next',center:'title',right:'today'}:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek,timeGridDay,listMonth'},footerToolbar:sm?{center:'listWeek,timeGridDay,dayGridMonth'}:false,height:'auto',navLinks:true,nowIndicator:true,dayMaxEvents:3,
 events:async(i,ok,fail)=>{try{const rows=await q(sb.from('visit_log').select('*').gte('visit_date',i.startStr.slice(0,10)).lte('visit_date',i.endStr.slice(0,10)).limit(1000));LAST=rows;ok(rows.map(r=>({id:r.id,title:`${r.full_name} → ${r.host_name||r.office||''}`,start:r.entry_at||r.expected_at||r.created_at,end:r.exit_at||undefined,color:{Expected:'#0d6efd','Checked In':'#198754','Checked Out':'#6c757d',Cancelled:'#dc3545'}[r.status]})))}catch(e){fail(e)}},eventClick:i=>det(+i.event.id)});cal.render()};
/* ---------- admin: posts, directory, users, audit, settings ---------- */
const CR={posts:{t:'reception_posts',h:'Reception Posts',c:[['name','Post name'],['location','Location']]},dir:{t:'mp_office_directory',h:'MP & Office Directory',c:[['mp_name','MP name'],['office_name','Office'],['department','Department'],['designation','Designation'],['receiving_officer','Receiving officer'],['location','Office location']]}};
let CRD={};
const crud=async k=>{const c=CR[k],rows=await q(sb.from(c.t).select('*').order('id'));CRD[k]=rows;return`<h4>${c.h}</h4><div class="panel"><button class="btn btn-primary mb-2" onclick="crForm('${k}')">Add</button><div class="table-responsive"><table class="table align-middle small"><thead><tr>${c.c.map(x=>`<th>${x[1]}</th>`).join('')}<th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr>${c.c.map(x=>`<td>${esc(r[x[0]])}</td>`).join('')}<td>${r.active?'<span class="bd" style="background:#198754">Active</span>':'<span class="bd" style="background:#6c757d">Inactive</span>'}</td><td><button class="btn btn-sm btn-outline-primary" onclick="crForm('${k}',${r.id})">Edit</button> <button class="btn btn-sm btn-outline-secondary" onclick="crTog('${k}',${r.id})">${r.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div></div>`};
V.posts=()=>crud('posts');V.dir=()=>crud('dir');
function crForm(k,id){const c=CR[k],r=CRD[k].find(x=>x.id==id)||{};bx((id?'Edit ':'Add ')+c.h,`<form onsubmit="crSave(event,'${k}',${id||0})" class="row g-2">${c.c.map(([n,l])=>`<div class="col-md-6"><label>${l}</label><input name="${n}" class="form-control" value="${esc(r[n])}"></div>`).join('')}<div class="col-12"><button class="btn btn-primary">Save</button></div></form>`)}
async function crSave(e,k,id){e.preventDefault();const o=Object.fromEntries(new FormData(e.target)),t=CR[k].t;await q(id?sb.from(t).update(o).eq('id',id):sb.from(t).insert(o));modal.hide();await reload();toast('Saved');refresh()}
async function crTog(k,id){const r=CRD[k].find(x=>x.id==id);await q(sb.from(CR[k].t).update({active:!r.active}).eq('id',id));await reload();refresh()}
const reload=async()=>{[POSTS,DIR]=await Promise.all([q(sb.from('reception_posts').select('*').eq('active',true).order('name')),q(sb.from('mp_office_directory').select('*').eq('active',true).order('mp_name'))])};
V.users=async()=>{const r=await q(sb.from('profiles').select('*').order('created_at'));return`<h4>User Management</h4><div class="panel"><p class="small text-muted">Create accounts in Supabase (Authentication → Users → Add user). New accounts appear here as <b>inactive</b>; activate them and assign a role.</p><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${r.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td><td><select class="form-select form-select-sm" onchange="upd('${u.id}',{role:this.value})"><option ${u.role=='reception'?'selected':''} value="reception">Reception officer</option><option ${u.role=='admin'?'selected':''} value="admin">Administrator</option></select></td><td><select class="form-select form-select-sm" onchange="upd('${u.id}',{status:this.value})"><option ${u.status=='active'?'selected':''}>active</option><option ${u.status=='inactive'?'selected':''}>inactive</option></select></td></tr>`).join('')}</tbody></table></div></div>`};
async function upd(id,o){if(id==ME.id&&(o.status=='inactive'||o.role=='reception')&&!confirm('This will remove your own administrator access. Continue?')){return refresh()}await q(sb.from('profiles').update(o).eq('id',id));toast('User updated')}
V.audit=async()=>{const [a,p]=await Promise.all([q(sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(200)),q(sb.from('profiles').select('id,full_name'))]),n=Object.fromEntries(p.map(x=>[x.id,x.full_name]));return`<h4>Audit Trail</h4><div class="panel"><div class="table-responsive"><table class="table table-sm small"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Record</th></tr></thead><tbody>${a.map(x=>`<tr><td>${fDT(x.created_at)}</td><td>${esc(n[x.user_id]||'—')}</td><td>${esc(x.action)}</td><td>${esc(x.record_type)} ${esc(x.record_id)}</td></tr>`).join('')}</tbody></table></div></div>`};
V.set=()=>`<h4>Settings</h4><div class="row g-3"><div class="col-lg-6"><form class="panel" onsubmit="setPw(event)"><h6>Signed in as ${esc(ME.email)} (${ADMIN?'Administrator':'Reception officer'})</h6><input type="password" id="np" minlength="8" class="form-control mb-2" placeholder="New password" required><button class="btn btn-primary">Change password</button></form></div><div class="col-lg-6"><div class="panel"><h6>Default pass size</h6><select class="form-select" onchange="localStorage.pgh_pass=this.value">${[['A5','A5'],['A6','A6'],['rc','Receipt (80mm)']].map(([v,t])=>`<option value="${v}" ${(localStorage.pgh_pass||'A6')==v?'selected':''}>${t}</option>`).join('')}</select></div></div></div>`;
</script></body></html>
